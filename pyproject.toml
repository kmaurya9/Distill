[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distill-mcp"
version = "0.1.0"
description = "MCP retrieval server for coding agents: tree-sitter code graph, BM25 + dense embeddings fused with RRF, MMR re-ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "bm25s>=0.2",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
distill = "distill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["distill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
